<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <mat-toolbar>
    <span class="brand">Fleet Pulse</span>
    <nav aria-label="Main">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Fleet</a
      >
      <a mat-button routerLink="/rules" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Rules</a
      >
      <a mat-button routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Settings</a
      >
    </nav>
    <span class="spacer"></span>
    @if (auth.isAuthenticated()) {
      <span class="connection-state" [class]="connection.phase()" aria-live="polite">
        <span class="connection-dot" aria-hidden="true"></span>
        {{ connection.phase() === 'live' ? 'Live' : connection.phase() }}
        @if (connection.transport()) {
          <span class="transport-name">· {{ connection.transport() }}</span>
        }
      </span>
      <button mat-button type="button" (click)="logout()">Sign out</button>
    }
  </mat-toolbar>
</header>

<main id="main" class="app-main" tabindex="-1">
  <router-outlet />
</main>
